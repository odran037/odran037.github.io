  <p id="n" data-initial="53662736772837">53662736772837</p>

  <script>
    const lines = [
      "Wake up, Leo...",
      "",
      "The Matrix has you...",
      "",
      "Follow the white rabbit.",
      "",
      "Knock, knock, Leo."
    ];
    const messageEl = document.getElementById('message');
    const rabbitEl = document.getElementById('rabbit');
    let lineIndex = 0;
    let charIndex = 0;
    let currentText = '';

    function type() {
      if (lineIndex >= lines.length) {
        // Done — show rabbit
        setTimeout(() => rabbitEl.classList.add('visible'), 600);
        return;
      }
      const line = lines[lineIndex];
      if (charIndex <= line.length) {
        currentText += line[charIndex - 1] || '';
        renderText();
        charIndex++;
        const delay = line === '' ? 0 : (Math.random() * 80 + 50);
        setTimeout(type, delay);
      } else {
        // End of line
        currentText += '\n';
        lineIndex++;
        charIndex = 0;
        const pause = lines[lineIndex] === '' ? 100 : 600;
        setTimeout(type, pause);
      }
    }

    function renderText() {
      const lines = currentText.split('\n');
      let html = '';
      lines.forEach((l, i) => {
        html += `<div>${escapeHtml(l) || '&nbsp;'}</div>`;
      });
      html += '';
      messageEl.innerHTML = html;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    setTimeout(type, 1000);
    // --- //
    const n = document.getElementById('n');
    const getRandomCharacter = (min, max) =>
      Math.floor(Math.random() * (max - min + 1)) + min;
    const generate = (limit, min, max) => {
      let charactersList = [];
      do {
        charactersList.push(String.fromCharCode(getRandomCharacter(min, max)));
      } while (--limit);
      return charactersList.join('');
    };
    setInterval(() => {
      let initial = n.getAttribute('data-initial');
      let len = initial.length;
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          let gen = generate(len, 48, 57);
          n.innerText = gen;
          document.title = gen;
        }, i * 10);
      }
      setTimeout(() => {
        n.innerText = initial;
        document.title = initial;
      }, 1000);
    }, 5000);
  </script>
